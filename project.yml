name: Mainbrella
options:
  bundleIdPrefix: com.mainbrella
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    GENERATE_INFOPLIST_FILE: YES
targets:
  Mainbrella:
    type: application
    platform: iOS
    sources: [Mainbrella]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mainbrella.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  MainbrellaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MainbrellaTests]
    dependencies:
      - target: Mainbrella
  MainbrellaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MainbrellaUITests]
    dependencies:
      - target: Mainbrella
schemes:
  Mainbrella:
    build:
      targets:
        Mainbrella: all
    test:
      targets: [MainbrellaTests, MainbrellaUITests]
