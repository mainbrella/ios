name: Mainbrella
options:
  bundleIdPrefix: com.mainbrella
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
    INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  Mainbrella:
    type: application
    platform: iOS
    sources:
      - path: Mainbrella
        excludes: [Info.plist]
    dependencies:
      - target: MainbrellaShare
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mainbrella.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_FILE: Mainbrella/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mainbrella/Mainbrella.entitlements
  MainbrellaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MainbrellaShare
        excludes: [Info.plist]
      - Mainbrella/APIClient.swift
      - Mainbrella/Models.swift
      - Mainbrella/ActivityStream.swift
      - Mainbrella/Theme.swift
      - Mainbrella/InboxAttachment.swift
      - Mainbrella/SharePayload.swift
      - Mainbrella/ShareStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mainbrella.ios.share
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: MainbrellaShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: MainbrellaShare/MainbrellaShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MainbrellaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MainbrellaTests]
    dependencies:
      - target: Mainbrella
  MainbrellaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MainbrellaUITests]
    dependencies:
      - target: Mainbrella
schemes:
  Mainbrella:
    build:
      targets:
        Mainbrella: all
    test:
      targets: [MainbrellaTests, MainbrellaUITests]
